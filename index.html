<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kişisel Finans Kokpiti V20 (Premium Edition)</title>
    
    <!-- PWA MANIFEST VE APPLE ICON ENTEGRASYONU -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png.webp">
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* GENEL YAPI VE GÖVDE */
        body { 
            background-color: #05080f; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            padding-bottom: 100px; 
            -webkit-tap-highlight-color: transparent; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            min-height: 100vh; 
            position: relative; 
            background: radial-gradient(circle at 50% 0%, #162035 0%, #05080f 80%); 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            overflow-x: hidden; 
        }
        
        /* ALT NAVİGASYON BAR */
        .bottom-nav { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 24px; 
            padding: 8px 12px; 
            padding-bottom: calc(8px + env(safe-area-inset-bottom)); 
            position: fixed; 
            bottom: 16px; 
            width: calc(100% - 32px); 
            max-width: 448px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 50; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        /* CAM PANEL EFEKTLERİ */
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1rem; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
        }
        
        .fab { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); 
            border: 4px solid #0f172a; 
            transform: translateY(-22px); 
        }
        
        .nav-item { 
            flex: 1; 
            text-align: center; 
            color: #64748b; 
            transition: all 0.3s ease; 
            font-size: 0.65rem; 
            font-weight: 600; 
        }

        .nav-item.active { 
            color: #10b981; 
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); 
        }

        .nav-item.active .nav-icon { 
            transform: translateY(-2px); 
            color: #10b981; 
        }

        .nav-icon { 
            font-size: 1.1rem; 
            margin-bottom: 0.2rem; 
            display: block; 
            transition: transform 0.3s ease; 
        }
        
        /* BİLDİRİM TOAST EFEKTLERİ */
        .toast { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-100px); 
            background: rgba(16, 185, 129, 0.95); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            z-index: 9999; 
            white-space: nowrap; 
            box-shadow: 0 10px 30px rgba(16,185,129,0.3); 
        }

        .toast.show { 
            transform: translateX(-50%) translateY(0); 
            opacity: 1; 
        }

        .spin-anim { 
            animation: spin 1s linear infinite; 
        }

        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        
        /* FORM ELEMANLARI VE INPUTLAR */
        input[type="number"]::-webkit-outer-spin-button, 
        input[type="number"]::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        input[type="number"], 
        input[type="text"], 
        input[type="date"], 
        select { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            border-radius: 0.5rem; 
            padding: 12px; 
            width: 100%; 
            font-size: 0.85rem; 
            outline: none; 
            margin-bottom: 14px; 
            transition: all 0.2s ease; 
        }

        input:focus, 
        select:focus { 
            border-color: #10b981; 
            box-shadow: 0 0 0 2px rgba(16,185,129,0.2); 
            background: rgba(15, 23, 42, 0.9); 
        }

        label { 
            font-size: 0.7rem; 
            color: #94a3b8; 
            margin-bottom: 6px; 
            display: block; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
        }
        
        /* KART TASARIMLARI */
        .premium-card { 
            position: relative; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.15); 
            transition: transform 0.2s; 
        }

        .premium-card:hover { 
            transform: translateY(-2px); 
        }

        .premium-card::before { 
            content: ""; 
            position: absolute; 
            inset: 0; 
            background: radial-gradient(circle at top right, rgba(255,255,255,0.2) 0%, transparent 60%); 
            pointer-events: none; 
        }
        
        .radio-btn-fatura input:checked + div { 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: white; 
            border-color: #ef4444; 
            box-shadow: 0 4px 12px rgba(239,68,68,0.3); 
        }

        .radio-btn-abone input:checked + div { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; 
            border-color: #3b82f6; 
            box-shadow: 0 4px 12px rgba(59,130,246,0.3); 
        }
        
        /* ÖZEL KAYDIRMA ÇUBUKLARI */
        .custom-scroll::-webkit-scrollbar { 
            height: 6px; 
            width: 6px; 
        }

        .custom-scroll::-webkit-scrollbar-track { 
            background: rgba(255,255,255,0.05); 
            border-radius: 10px; 
            margin: 0 4px; 
        }

        .custom-scroll::-webkit-scrollbar-thumb { 
            background: rgba(16, 185, 129, 0.4); 
            border-radius: 10px; 
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover { 
            background: rgba(16, 185, 129, 0.8); 
        }

        .custom-scroll { 
            scrollbar-width: thin; 
            scrollbar-color: rgba(16, 185, 129, 0.4) rgba(255,255,255,0.05); 
        }

        .no-scrollbar::-webkit-scrollbar { 
            display: none; 
        }

        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Bildirim Toast Alanı -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check mr-2"></i> 
        <span id="toastMsg">İşlem başarılı</span>
    </div>

    <!-- ÜST BAR (ZAMAN YOLCULUĞU VE MENÜ) -->
    <div class="sticky top-0 z-40 bg-[#0B1120]/90 backdrop-blur-xl border-b border-slate-800/80 px-3 py-3 flex justify-between items-center h-[56px] shadow-sm">
        
        <!-- Sol Menü Alanı -->
        <div class="flex items-center relative z-[60] flex-1">
            <div class="relative">
                <button id="menuBtn" onclick="document.getElementById('actionMenu').classList.toggle('hidden')" class="w-9 h-9 rounded-full bg-slate-800/80 border border-slate-700 text-blue-400 flex items-center justify-center transition-colors hover:bg-slate-700 shadow-sm" title="Menü">
                    <i class="fa-solid fa-bars text-[14px]"></i>
                </button>
                
                <div id="actionMenu" class="hidden absolute top-12 left-0 bg-slate-800/95 backdrop-blur-md border border-slate-700 rounded-xl p-2 shadow-2xl flex flex-col gap-1 w-[180px]">
                    <button onclick="openSearch(); document.getElementById('actionMenu').classList.add('hidden')" class="text-left px-3 py-2.5 hover:bg-slate-700/50 rounded-lg text-[11px] font-bold text-slate-200 transition-colors">
                        <i class="fa-solid fa-magnifying-glass w-4 text-center mr-1"></i> Detaylı Arama
                    </button>
                    
                    <div class="border-t border-slate-700/50 my-0.5"></div>
                    
                    <button onclick="exportExcel(); document.getElementById('actionMenu').classList.add('hidden')" class="text-left px-3 py-2.5 hover:bg-slate-700/50 rounded-lg text-[11px] font-bold text-emerald-400 transition-colors">
                        <i class="fa-solid fa-file-excel w-4 text-center mr-1"></i> Excel'e Aktar (CSV)
                    </button>
                    
                    <button onclick="exportData(); document.getElementById('actionMenu').classList.add('hidden')" class="text-left px-3 py-2.5 hover:bg-slate-700/50 rounded-lg text-[11px] font-bold text-blue-400 transition-colors">
                        <i class="fa-solid fa-download w-4 text-center mr-1"></i> Yedeği İndir (JSON)
                    </button>
                    
                    <button onclick="document.getElementById('importFile').click(); document.getElementById('actionMenu').classList.add('hidden')" class="text-left px-3 py-2.5 hover:bg-slate-700/50 rounded-lg text-[11px] font-bold text-amber-400 transition-colors">
                        <i class="fa-solid fa-upload w-4 text-center mr-1"></i> Yedek Yükle
                    </button>
                </div>
            </div>
            
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
        </div>
        
        <!-- Orta Alan: Zaman Yolculuğu (Ay/Tarih Seçici) -->
        <div class="flex justify-center flex-shrink-0 z-0">
            <div class="flex items-center gap-1.5 bg-slate-800/80 rounded-full px-2 py-1.5 border border-slate-700 transition-colors shadow-inner">
                <button onclick="changeMonth(-1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white rounded-full hover:bg-slate-700 transition-colors">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>
                
                <div class="relative flex items-center justify-center cursor-pointer min-w-[75px]" onclick="document.getElementById('datePicker').showPicker()">
                    <span id="currentDateDisplay" class="font-bold text-[11px] tracking-wider text-white text-center whitespace-nowrap">Yükleniyor...</span>
                    <input type="date" id="datePicker" class="absolute w-0 h-0 opacity-0 border-0 p-0 m-0" onchange="changeDateFromPicker(this.value)">
                </div>
                
                <button onclick="changeMonth(1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white rounded-full hover:bg-slate-700 transition-colors">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>
        
        <!-- Sağ Alan: Gizlilik Modu -->
        <div class="flex items-center gap-2.5 relative z-10 flex-1 justify-end">
            <button onclick="togglePrivacy()" class="w-9 h-9 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center transition-colors shadow-sm">
                <i id="eyeIcon" class="fa-solid fa-eye text-[12px] text-slate-300"></i>
            </button>
        </div>
    </div>

    <!-- İÇERİK ALANI -->
    <div id="content-area" class="p-4"></div>

    <!-- ALT NAVİGASYON BAR -->
    <div class="bottom-nav flex justify-between items-center">
        <button class="nav-item active" onclick="switchTab('giderler', this)">
            <i class="fa-solid fa-receipt nav-icon"></i>
            Hareketler
        </button>
        
        <button class="nav-item" onclick="switchTab('taksitler', this)">
            <i class="fa-solid fa-credit-card nav-icon"></i>
            Kart/Hesap
        </button>
        
        <div class="relative flex justify-center w-16">
            <button onclick="openMenuModal()" class="fab w-12 h-12 rounded-full flex items-center justify-center text-white text-xl transition-colors hover:brightness-110">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        
        <button class="nav-item" onclick="switchTab('alacaklar', this)">
            <i class="fa-solid fa-users nav-icon"></i>
            Alacaklar
        </button>
        
        <button class="nav-item" onclick="switchTab('cuzdan', this)">
            <i class="fa-solid fa-vault nav-icon"></i>
            Cüzdan
        </button>
    </div>

    <!-- YENİ KAYIT EKLEME MENÜSÜ MODALI -->
    <div id="menuModal" class="fixed inset-0 bg-[#05080f]/90 backdrop-blur-md hidden z-[100] flex items-center justify-center opacity-0 transition-opacity duration-200" onclick="if(event.target === this) closeMenuModal()">
        
        <div class="glass-panel w-11/12 max-w-[360px] p-5 transform scale-95 transition-transform duration-200" id="menuModalContent" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-base font-bold text-white tracking-wide">Yeni Kayıt Ekle</h3>
                <button onclick="closeMenuModal()" class="text-slate-400 hover:text-white bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-3">
                <button onclick="openForm('gelir')" class="bg-gradient-to-br from-emerald-500/20 to-emerald-500/5 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl text-left transition-all hover:bg-emerald-500/20">
                    <i class="fa-solid fa-arrow-down mb-2 text-lg"></i><br>
                    <span class="font-bold text-sm">Gelir Ekle</span>
                </button>
                
                <button onclick="openForm('gider')" class="bg-gradient-to-br from-rose-500/20 to-rose-500/5 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-left transition-all hover:bg-rose-500/20">
                    <i class="fa-solid fa-arrow-up mb-2 text-lg"></i><br>
                    <span class="font-bold text-sm">Gider Ekle</span>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openForm('varlik')" class="bg-amber-500/10 border border-amber-500/20 text-amber-400 p-3 rounded-xl text-center transition-all hover:bg-amber-500/20">
                    <i class="fa-solid fa-coins mb-1 text-lg block"></i>
                    <span class="font-bold text-xs">Varlık Ekle</span>
                </button>
                
                <button onclick="openForm('taksit')" class="bg-blue-500/10 border border-blue-500/20 text-blue-400 p-3 rounded-xl text-center transition-all hover:bg-blue-500/20">
                    <i class="fa-solid fa-building-columns mb-1 text-lg block"></i>
                    <span class="font-bold text-xs">Kart/Hesap</span>
                </button>
                
                <button onclick="openForm('alacak')" class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 p-3 rounded-xl text-center transition-all hover:bg-indigo-500/20">
                    <i class="fa-solid fa-handshake mb-1 text-lg block"></i>
                    <span class="font-bold text-xs">Alacak/Borç</span>
                </button>
                
                <button onclick="openForm('abonelik')" class="bg-teal-500/10 border border-teal-500/20 text-teal-400 p-3 rounded-xl text-center transition-all hover:bg-teal-500/20">
                    <i class="fa-solid fa-file-invoice mb-1 text-lg block"></i>
                    <span class="font-bold text-xs">Fatura/Abone</span>
                </button>
            </div>
            
        </div>
    </div>

    <!-- DİNAMİK FORM OLUŞTURUCU MODALI -->
    <div id="dynamicFormModal" class="fixed inset-0 bg-[#05080f]/95 backdrop-blur-xl hidden z-[110] flex items-center justify-center p-4" onclick="if(event.target === this) closeForm()">
        <div class="glass-panel w-11/12 max-w-[380px] p-5 max-h-[90vh] overflow-y-auto custom-scroll" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-3">
                <h3 class="text-base font-bold text-white tracking-wide" id="formTitle">Form</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-white bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <input type="hidden" id="formType">
            
            <div id="dynamicFormBody" class="space-y-1"></div>
            
            <button onclick="saveFormData()" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm mt-5 shadow-[0_4px_15px_rgba(16,185,129,0.3)] transition-all">
                KAYDET
            </button>
            
        </div>
    </div>

    <!-- ONAY MODALI (SİLME İŞLEMLERİ İÇİN) -->
    <div id="confirmModal" class="fixed inset-0 bg-[#05080f]/90 backdrop-blur-md hidden z-[120] flex items-center justify-center p-4" onclick="if(event.target === this) closeConfirm()">
        <div class="glass-panel w-11/12 max-w-[320px] p-6 text-center" onclick="event.stopPropagation()">
            <div class="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/30">
                <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
            </div>
            <h3 id="confirmMsg" class="text-white font-bold text-base mb-6">Emin misiniz?</h3>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:bg-slate-700 transition-colors">
                    İPTAL
                </button>
                <button id="confirmBtn" class="flex-1 py-3 rounded-xl bg-rose-600 text-white text-xs font-bold hover:bg-rose-500 shadow-[0_4px_15px_rgba(225,29,72,0.3)] transition-colors">
                    ONAYLA
                </button>
            </div>
        </div>
    </div>
    
    <!-- TUTAR GİRİN PROMPT MODALI (ÖDEMELER VE TAHSİLAT İÇİN) -->
    <div id="promptModal" class="fixed inset-0 bg-[#05080f]/95 backdrop-blur-md hidden z-[120] flex items-center justify-center p-4" onclick="if(event.target === this) closePrompt()">
        <div class="glass-panel w-11/12 max-w-[340px] p-5" onclick="event.stopPropagation()">
            <h3 id="promptMsg" class="text-white font-bold text-sm mb-4 whitespace-pre-line text-center">Tutar Girin</h3>
            
            <input type="text" id="promptInput" inputmode="decimal" class="!mb-5 !py-4 text-center text-2xl font-extrabold text-emerald-400 tracking-wider bg-slate-900/50 shadow-inner">
            
            <div id="promptOdemeAlani" class="hidden mb-5">
                <label>İşlem Yapılan Hesap / Kaynak</label>
                <select id="promptOdemeSelect" class="!mb-0 !py-3 font-semibold text-sm"></select>
            </div>
            
            <div class="flex gap-3">
                <button onclick="closePrompt()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:text-white transition-colors">
                    İPTAL
                </button>
                <button id="promptBtn" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-white text-xs font-bold hover:brightness-110 shadow-[0_4px_15px_rgba(16,185,129,0.3)] transition-all">
                    ONAYLA
                </button>
            </div>
        </div>
    </div>

    <!-- KAPSAMLI ANALİZ MODALI -->
    <div id="analizModal" class="fixed inset-0 bg-[#05080f]/95 backdrop-blur-xl hidden z-[110] flex items-center justify-center p-4" onclick="if(event.target === this) document.getElementById('analizModal').classList.add('hidden')">
        <div class="glass-panel w-11/12 max-w-[380px] max-h-[85vh] overflow-y-auto p-5 custom-scroll" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-3">
                <h3 class="text-base font-bold text-white" id="analizModalTitle">
                    <i class="fa-solid fa-chart-pie text-indigo-400 mr-2"></i>Kapsamlı Analiz
                </h3>
                <button onclick="document.getElementById('analizModal').classList.add('hidden')" class="text-slate-400 hover:text-white bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="analizContent" class="space-y-6"></div>
        </div>
    </div>

    <!-- DETAYLI ARAMA MODALI -->
    <div id="searchModal" class="fixed inset-0 bg-[#05080f]/95 backdrop-blur-xl hidden z-[110] flex items-center justify-center p-4" onclick="if(event.target === this) closeSearch()">
        <div class="glass-panel w-11/12 max-w-[380px] h-[80vh] flex flex-col p-5" onclick="event.stopPropagation()">
            <div class="flex gap-2 mb-5">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="performSearch()" placeholder="İşlem ara..." class="w-full !mb-0 !pl-10 !py-3" autofocus>
                </div>
                <button onclick="closeSearch()" class="bg-slate-800 px-5 rounded-xl text-slate-300 font-bold text-xs hover:bg-slate-700 border border-slate-700">
                    KAPAT
                </button>
            </div>
            <div id="searchResults" class="overflow-y-auto flex-1 space-y-2 custom-scroll"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================
    // EKRANA TIKLAYINCA AÇIK MENÜLERİ KAPATMA
    // =========================================================
    window.addEventListener('click', function(e) {
        let aMenu = document.getElementById('actionMenu');
        let aBtn = document.getElementById('menuBtn');
        
        if(aMenu && !aMenu.classList.contains('hidden') && aBtn && !aBtn.contains(e.target) && !aMenu.contains(e.target)) {
            aMenu.classList.add('hidden');
        }
    });

    // =========================================================
    // VERİTABANI KONTROLÜ VE LOCALSTORAGE MANTIĞI
    // =========================================================
    let eskiDb = JSON.parse(localStorage.getItem('finans_veritabani_v18')) || JSON.parse(localStorage.getItem('finans_veritabani_v15'));
    
    let db = JSON.parse(localStorage.getItem('finans_veritabani_v20')) || 
             JSON.parse(localStorage.getItem('finans_veritabani_v19')) || 
             eskiDb || { 
        hareketler: [], 
        cuzdan: [], 
        taksitler: [],

    async function fetchLiveRates(silent = true) {
        if(!silent) { 
            let rBtn = document.getElementById('refreshBtnIcon'); 
            if(rBtn) {
                rBtn.classList.add('spin-anim'); 
            }
        }
        
        try {
            const response = await fetch('https://api.genelpara.com/embed/para-birimleri.json');
            
            if(response.ok) {
                const data = await response.json();
                altinkaynak.usd = parseFloat(data.USD.satis) || altinkaynak.usd;
                altinkaynak.eur = parseFloat(data.EUR.satis) || altinkaynak.eur;
                altinkaynak.has = parseFloat(data.GA.satis) || altinkaynak.has; 
                altinkaynak.ceyrek = parseFloat(data.C.satis) || altinkaynak.ceyrek;
                altinkaynak.gram22 = parseFloat(data.GA.satis) * 0.916 || altinkaynak.gram22;
            }
        } catch(e) { 
            console.log("Kur bağlantısı kurulamadı, API yanıt vermiyor."); 
        }
        
        if(!silent) {
            let rBtn = document.getElementById('refreshBtnIcon');
            if(rBtn) {
                rBtn.classList.remove('spin-anim');
            }
            showToast("Kurlar güncellendi!", "fa-bolt");
        }
        
        if(currentTab === 'cuzdan' || currentTab === 'alacaklar') {
            switchTab(currentTab); 
        }
        
        countdown = 180; 
        startTimer();
    }

    function startTimer() {
        if(timerInterval) {
            clearInterval(timerInterval);
        }
        
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            countdown--; 
            updateTimerDisplay();
            
            if(countdown <= 0) { 
                clearInterval(timerInterval); 
                fetchLiveRates(true); 
            }
        }, 1000);
    }

    function formatTarih(dateStr) {
        if(!dateStr || !dateStr.includes('-')) return dateStr;
        
        let dIslem = new Date(dateStr); 
        let dGecerli = new Date();
        
        dIslem.setHours(0,0,0,0); 
        dGecerli.setHours(0,0,0,0);
        
        let days = Math.round((dGecerli - dIslem) / (1000 * 60 * 60 * 24));
        
        if(days === 0) return 'Bugün'; 
        if(days === 1) return 'Dün'; 
        if(days === -1) return 'Yarın';
        
        const aylarKisa = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
        return `${dIslem.getDate().toString().padStart(2, '0')} ${aylarKisa[dIslem.getMonth()]} ${dIslem.getFullYear()}`;
    }

    function formatNumberInput(e) {
        let val = e.target.value.replace(/[^0-9,-]/g, '');
        let isNegative = val.startsWith('-');
        val = val.replace(/-/g, '');
        
        if(val === '') { 
            e.target.value = isNegative ? '-' : ''; 
            return; 
        }
        
        let parts = val.split(',');
        if (parts.length > 2) {
            parts = [parts[0], parts.slice(1).join('')]; 
        }
        
        let integerPart = parts[0];
        let decimalPart = parts.length > 1 ? ',' + parts[1] : '';
        
        if (integerPart.length > 1 && integerPart.startsWith('0')) {
            integerPart = integerPart.replace(/^0+/, '');
            if (integerPart === '') {
                integerPart = '0';
            }
        }
        
        if (integerPart === '' && parts.length > 1) { 
            integerPart = '0'; 
        }
        
        integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); 
        e.target.value = (isNegative ? '-' : '') + integerPart + decimalPart;
    }
    
    function parseFormatted(val) { 
        if(!val || val === '') return NaN; 
        return parseFloat(val.toString().replace(/\./g, '').replace(',', '.')); 
    }
    
    function toFormat(val, decimals = 0) {
        if(val === null || val === undefined || isNaN(val) || val === '') return '';
        
        let str = decimals > 0 ? val.toFixed(decimals).replace('.', ',') : val.toString().replace('.', ',');
        let parts = str.split(',');
        let integerPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        
        return parts.length > 1 ? integerPart + ',' + parts[1] : integerPart;
    }

    function getNotifications() {
        let list = [];
        let aDate = new Date();
        aDate.setHours(0,0,0,0);
        
        db.alacaklar.forEach(a => {
            if(a && a.vadeTarihi && (a.miktar - (a.odenen||0) > 0)) {
                let vDate = new Date(a.vadeTarihi); 
                vDate.setHours(0,0,0,0);
                
                let diff = Math.ceil((vDate - aDate) / (1000 * 60 * 60 * 24));
                
                if(diff >= 0 && diff <= 3) {
                    list.push({ 
                        baslik: a.baslik + (a.tip === 'alacak' ? ' Tahsilatı' : ' Borcu'), 
                        tarihText: diff === 0 ? "Bugün Son" : diff === 1 ? "Yarın" : diff + " Gün Kaldı", 
                        miktar: a.miktar - (a.odenen||0), 
                        tip: a.tip === 'alacak' ? 'gelir' : 'gider' 
                    });
                }
            }
        });
        
        let currAy = aDate.getFullYear() + "-" + (aDate.getMonth() + 1);
        let gun = aDate.getDate();
        
        db.abonelikler.forEach(ab => {
            if(ab && ab.odemeAyi !== currAy) {
                let diff = ab.resetGun - gun;
                if(diff >= 0 && diff <= 3) {
                    list.push({ 
                        baslik: ab.baslik + " " + (ab.tur === 'fatura' ? 'Faturası' : 'Aboneliği'), 
                        tarihText: diff === 0 ? "Bugün Son" : diff === 1 ? "Yarın" : diff + " Gün Kaldı", 
                        miktar: 0, 
                        tip: 'gider' 
                    });
                }
            }
        });
        
        return list;
    }

    function openNotifications() {
        let notifs = getNotifications();
        
        if(notifs.length === 0) {
            return showToast("Yaklaşan ödeme/tahsilat yok.", "fa-bell");
        }
        
        let html = notifs.map(n => `
            <div class="glass-panel p-3 mb-2 border-l-4 border-l-${n.tip==='gider'?'rose':'emerald'}-500 bg-slate-800/60">
                <div class="font-bold text-white text-[12px] mb-1">${n.baslik}</div>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-[9px] text-slate-400 bg-slate-900/80 px-2 py-1 rounded font-bold border border-white/5">
                        <i class="fa-solid fa-clock mr-1"></i> ${n.tarihText}
                    </span>
                    ${n.miktar > 0 ? `<span class="font-bold text-${n.tip==='gider'?'rose':'emerald'}-400 text-[11px]">${fNum(n.miktar)} ₺</span>` : '<span class="text-[9px] font-bold text-slate-500 uppercase">Tutar Belirsiz</span>'}
                </div>
            </div>
        `).join('');
        
        document.getElementById('analizContent').innerHTML = html;
        document.getElementById('analizModalTitle').innerHTML = '<i class="fa-solid fa-bell text-amber-400 mr-2"></i>Yaklaşanlar Panosu';
        document.getElementById('analizModal').classList.remove('hidden');
    }

    function bakiyeDus(odemeId, tutar) {
        if(!odemeId || odemeId === 'nakit') { 
            let tl = db.cuzdan.find(c => c && c.tip === 'tl'); 
            if(tl) {
                tl.miktar = Math.max(0, (tl.miktar||0) - tutar); 
            }
        }
        else if (odemeId.startsWith('v_')) { 
            let vId = parseInt(odemeId.split('_')[1]); 
            let v = db.vadesiz.find(x => x && x.id === vId); 
            if(v) {
                v.bakiye -= tutar; 
            }
        }
        else { 
            let kart = db.taksitler.find(t => t && t.id == odemeId); 
            if(kart && kart.tur === 'kart') {
                kart.borc += tutar; 
            }
        }
    }
    
    function bakiyeEkle(odemeId, tutar) {
        if(!odemeId || odemeId === 'nakit') { 
            let tl = db.cuzdan.find(c => c && c.tip === 'tl'); 
            if(tl) {
                tl.miktar = (tl.miktar||0) + tutar; 
            } else { 
                db.cuzdan.push({ id: Date.now(), tip: 'tl', miktar: tutar, maliyet: 1 }); 
            } 
        }
        else if (odemeId.startsWith('v_')) { 
            let vId = parseInt(odemeId.split('_')[1]); 
            let v = db.vadesiz.find(x => x && x.id === vId); 
            if(v) {
                v.bakiye += tutar; 
            }
        }
    }

    function saveFormData() {
        let tip = document.getElementById('formType').value; 
        let id = Date.now();
        
        if (tip.startsWith('bozdur_')) {
            let vTip = tip.split('_')[1]; 
            let adet = parseFormatted(document.getElementById('f_bozdur_adet').value); 
            let fiyat = parseFormatted(document.getElementById('f_bozdur_fiyat').value);
            
            if(isNaN(adet) || adet <= 0) return showToast("Miktar giriniz!", "fa-exclamation"); 
            if(isNaN(fiyat) || fiyat <= 0) return showToast("Fiyat giriniz!", "fa-exclamation");
            
            let entries = db.cuzdan.filter(x => x && x.tip === vTip); 
            let totalAdet = entries.reduce((sum, e) => sum + (e.miktar||0), 0);
            
            if(adet > totalAdet) return showToast("Yetersiz bakiye!", "fa-exclamation");
            
            let remaining = adet;
            for(let i = 0; i < db.cuzdan.length; i++) { 
                let c = db.cuzdan[i]; 
                
                if(c && c.tip === vTip && remaining > 0) { 
                    if((c.miktar||0) <= remaining) { 
                        remaining -= (c.miktar||0); 
                        c.miktar = 0; 
                    } else { 
                        c.miktar -= remaining; 
                        remaining = 0; 
                    } 
                } 
            }
            db.cuzdan = db.cuzdan.filter(x => x && (x.miktar||0) > 0); 
            
            let gelirMiktari = adet * fiyat; 
            let isim = varlikTurleri[vTip] ? varlikTurleri[vTip].ad : vTip;
            
            db.hareketler.unshift({ id: Date.now(), tip: 'gelir', baslik: `Varlık Bozdurma (${isim})`, miktar: gelirMiktari, tarih: getTodayStr(), odemeYontemi: 'nakit' });
            bakiyeEkle('nakit', gelirMiktari); 
            
            closeForm(); 
            saveData(); 
            showToast("Bozduruldu ve Nakite Eklendi!"); 
            return;
        }
        else if (tip.startsWith('edit_hareket_')) {
            let editId = parseInt(tip.split('_')[2]); 
            let h = db.hareketler.find(x => x && x.id === editId);
            
            if(h) { 
                let cat = document.getElementById('f_edit_kategori').value; 
                let desc = document.getElementById('f_edit_baslik').value.trim(); 
                h.baslik = desc ? `${cat} - ${desc}` : cat; 
                let yeniMiktar = parseFormatted(document.getElementById('f_edit_tutar').value); 
                
                if(!isNaN(yeniMiktar) && yeniMiktar > 0) {
                    h.miktar = yeniMiktar; 
                }
                
                if(h.tip === 'gider') { 
                    let odeme = document.getElementById('f_edit_odeme'); 
                    if(odeme) h.odemeYontemi = odeme.value; 
                } 
            }
            closeForm(); 
            saveData(); 
            showToast("Güncellendi!"); 
            return;
        }
        else if (tip.startsWith('edit_vadesiz_')) {
            let editId = parseInt(tip.split('_')[2]); 
            let v = db.vadesiz.find(x => x && x.id === editId);
            
            if(v) { 
                v.baslik = document.getElementById('f_edit_baslik').value.trim() || v.baslik; 
                let yeniB = parseFormatted(document.getElementById('f_edit_bakiye').value); 
                
                if(!isNaN(yeniB)) {
                    v.bakiye = yeniB; 
                }
            }
            closeForm(); 
            saveData(); 
            showToast("Güncellendi!"); 
            return;
        }
        else if (tip.startsWith('edit_alacak_')) {
            let editId = parseInt(tip.split('_')[2]); 
            let a = db.alacaklar.find(x => x && x.id === editId);
            
            if(a) { 
                a.baslik = document.getElementById('f_edit_baslik').value.trim() || a.baslik; 
                let yM = parseFormatted(document.getElementById('f_edit_tutar').value); 
                
                if(!isNaN(yM) && yM > 0) {
                    a.miktar = yM; 
                }
                
                a.vadeTarihi = document.getElementById('f_edit_vade').value; 
                a.telefon = document.getElementById('f_edit_telefon').value.trim(); 
            }
            closeForm(); 
            saveData(); 
            showToast("Güncellendi!"); 
            return;
        }
        else if (tip.startsWith('edit_taksit_')) {
            let editId = parseInt(tip.split('_')[2]); 
            let t = db.taksitler.find(x => x && x.id === editId);
            
            if(t) { 
                t.baslik = document.getElementById('f_edit_baslik').value.trim() || t.baslik; 
                let yL = parseFormatted(document.getElementById('f_edit_limit').value); 
                
                if(!isNaN(yL) && yL > 0) {
                    t.limit = yL; 
                }
                
                if(t.tur === 'kart') { 
                    let yB = parseFormatted(document.getElementById('f_edit_borc').value); 
                    if(!isNaN(yB) && yB >= 0) t.borc = yB; 
                } else { 
                    let yO = parseFormatted(document.getElementById('f_edit_odenen').value); 
                    if(!isNaN(yO) && yO >= 0) { 
                        t.odenen = yO; 
                        t.borc = t.limit - t.odenen; 
                    } 
                } 
            }
            closeForm(); 
            saveData(); 
            showToast("Güncellendi!"); 
            return;
        }
        else if (tip.startsWith('edit_abone_')) {
            let editId = parseInt(tip.split('_')[2]); 
            let ab = db.abonelikler.find(x => x && x.id === editId);
            
            if(ab) { 
                ab.baslik = document.getElementById('f_edit_baslik').value.trim() || ab.baslik; 
                let gunVal = parseInt(parseFormatted(document.getElementById('f_edit_gun').value)); 
                
                if(!isNaN(gunVal) && gunVal >= 1 && gunVal <= 31) {
                    ab.resetGun = gunVal; 
                }
                
                let abTurEl = document.querySelector('input[name="f_edit_ab_tur"]:checked'); 
                if(abTurEl) {
                    ab.tur = abTurEl.value; 
                }
            }
            closeForm(); 
            saveData(); 
            showToast("Güncellendi!"); 
            return;
        }

        if (tip === 'gelir' || tip === 'gider') {
            let kategori = document.getElementById('f_kategori').value; 
            let baslikEk = document.getElementById('f_baslik').value.trim(); 
            let tamBaslik = baslikEk ? `${kategori} - ${baslikEk}` : kategori; 
            let tutar = parseFormatted(document.getElementById('f_tutar').value);
            
            if(isNaN(tutar) || tutar <= 0) {
                return showToast("Tutar giriniz!", "fa-exclamation");
            }
            
            db.sonTutarlar[tip][kategori] = tutar;
            
            if (tip === 'gider') {
                let odemeId = document.getElementById('f_odeme').value; 
                let taksitS = parseInt(parseFormatted(document.getElementById('f_taksit')?.value)) || 1;
                
                bakiyeDus(odemeId, tutar);
                
                if (odemeId !== 'nakit' && !odemeId.startsWith('v_') && taksitS > 1) {
                    let kart = db.taksitler.find(t => t && t.id == odemeId); 
                    let ilkTaksit = tutar / taksitS; 
                    
                    if(kart) {
                        db.taksitler.push({ id: Date.now()+1, tur: 'kredi', banka: kart.banka, baslik: `[Taksit] ${tamBaslik}`, limit: tutar, borc: tutar - ilkTaksit, odenen: ilkTaksit, taksitS: taksitS }); 
                    }
                    db.hareketler.unshift({ id, tip: 'gider', baslik: tamBaslik + ` (1/${taksitS} Taksit)`, miktar: ilkTaksit, tarih: getTodayStr(), odemeYontemi: odemeId });
                } else { 
                    db.hareketler.unshift({ id, tip: 'gider', baslik: tamBaslik, miktar: tutar, tarih: getTodayStr(), odemeYontemi: odemeId }); 
                }
            } else { 
                db.hareketler.unshift({ id, tip: 'gelir', baslik: tamBaslik, miktar: tutar, tarih: getTodayStr(), odemeYontemi: 'nakit' }); 
                bakiyeEkle('nakit', tutar); 
            }
        }
        else if (tip === 'vadesiz') {
            let banka = document.getElementById('f_banka').value; 
            let baslik = document.getElementById('f_baslik').value.trim(); 
            let bakiye = parseFormatted(document.getElementById('f_bakiye').value) || 0;
            
            if(!baslik) return showToast("Eksik bilgi!", "fa-exclamation"); 
            
            db.vadesiz.push({ id, banka, baslik, bakiye });
        }
        else if (tip === 'alacak') {
            let baslik = document.getElementById('f_baslik').value.trim(); 
            let telefon = document.getElementById('f_telefon').value.trim(); 
            let alTip = document.getElementById('f_tur').value; 
            let birim = document.getElementById('f_birim').value; 
            let birimDiger = document.getElementById('f_birim_diger').value.trim(); 
            let tutar = parseFormatted(document.getElementById('f_tutar').value); 
            let vadeTarihi = document.getElementById('f_vade').value;
            
            if(!baslik || isNaN(tutar)) {
                return showToast("Eksik bilgi!", "fa-exclamation"); 
            }
            if(birim === 'Diğer' && !birimDiger) {
                return showToast("Birim türünü elle yazın!", "fa-exclamation");
            }
            
            db.alacaklar.push({ id, tip: alTip, baslik, telefon, miktar: tutar, odenen: 0, birim, birimDiger, sonIslemTutari: 0, vadeTarihi });
        }
        else if (tip === 'varlik') {
            let tur = document.getElementById('f_tur').value; 
            let adet = parseFormatted(document.getElementById('f_adet').value); 
            let maliyet = parseFormatted(document.getElementById('f_maliyet').value);
            
            if(isNaN(adet) || isNaN(maliyet)) return showToast("Eksik bilgi!", "fa-exclamation"); 
            
            db.cuzdan.push({ id, tip: tur, miktar: adet, maliyet: maliyet });
        }
        else if (tip === 'taksit') {
            let kkTur = document.getElementById('f_kartkredi_tur').value; 
            let banka = document.getElementById('f_banka').value; 
            let baslik = document.getElementById('f_baslik').value.trim();
            
            if(!baslik) return showToast("Adı boş bırakma!", "fa-exclamation");
            
            if(kkTur === 'kart') { 
                let limit = parseFormatted(document.getElementById('f_limit').value); 
                let borc = parseFormatted(document.getElementById('f_borc').value) || 0; 
                db.taksitler.push({ id, tur: 'kart', banka, baslik, limit, borc }); 
            } else { 
                let toplam = parseFormatted(document.getElementById('f_kredi_toplam').value); 
                let taksit = parseFormatted(document.getElementById('f_kredi_taksit').value); 
                let odenen = parseFormatted(document.getElementById('f_kredi_odenen').value) || 0; 
                db.taksitler.push({ id, tur: 'kredi', banka, baslik, limit: toplam, borc: toplam - odenen, odenen, taksitS: taksit }); 
            }
        }
        else if (tip === 'abonelik') {
            let abTur = document.querySelector('input[name="f_ab_tur"]:checked').value; 
            let baslik = document.getElementById('f_baslik').value.trim(); 
            let gunVal = parseInt(parseFormatted(document.getElementById('f_gun').value)); 
            let gun = (!isNaN(gunVal) && gunVal >= 1 && gunVal <= 31) ? gunVal : 1;
            
            if(!baslik) return showToast("Adı giriniz!", "fa-exclamation"); 
            
            db.abonelikler.push({ id, baslik, resetGun: gun, odenen: 0, odemeAyi: '', tur: abTur });
        }
        else if (tip === 'hedef') {
            let baslik = document.getElementById('f_baslik').value.trim(); 
            let tutar = parseFormatted(document.getElementById('f_tutar').value);
            
            if(!baslik || isNaN(tutar) || tutar <= 0) return showToast("Eksik bilgi!", "fa-exclamation"); 
            
            db.hedefler.push({ id, baslik, hedefFiyat: tutar, biriken: 0 });
        }
        else if (tip === 'transfer') {
            let gonderen = document.getElementById('f_trans_gonderen').value;
            let alici = document.getElementById('f_trans_alici').value;
            let tutar = parseFormatted(document.getElementById('f_trans_tutar').value);
            let komisyon = parseFormatted(document.getElementById('f_trans_komisyon').value) || 0;

            if(!gonderen || !alici) return showToast("Hesap seçmelisiniz!", "fa-exclamation");
            if(gonderen === alici) return showToast("Aynı hesaba transfer yapılamaz!", "fa-exclamation");
            if(isNaN(tutar) || tutar <= 0) return showToast("Tutar giriniz!", "fa-exclamation");

            bakiyeDus(gonderen, tutar + komisyon);
            bakiyeEkle(alici, tutar);

            let gV = db.vadesiz.find(x => x.id == gonderen.split('_')[1]);
            let aV = db.vadesiz.find(x => x.id == alici.split('_')[1]);

            db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: `Transfer (${aV.baslik})`, miktar: tutar, tarih: getTodayStr(), odemeYontemi: gonderen });
            db.hareketler.unshift({ id: Date.now()+1, tip: 'gelir', baslik: `Transfer (${gV.baslik})`, miktar: tutar, tarih: getTodayStr(), odemeYontemi: alici });

            if(komisyon > 0) {
                db.hareketler.unshift({ id: Date.now()+2, tip: 'gider', baslik: `Transfer Komisyonu`, miktar: komisyon, tarih: getTodayStr(), odemeYontemi: gonderen });
            }
        }
        else if (tip === 'kota') {
            let val = parseFormatted(document.getElementById('f_kota_tutar').value);
            
            if(!isNaN(val) && val >= 0) {
                db.alisverisKotasi = val;
            }
        }
        
        closeForm(); 
        saveData(); 
        showToast("Kaydedildi!");
    }

    function promptBakiyeGuncelle(id) {
        showPrompt("Eklenecek tutarı girin. (Eksi bakiye için başına - koyun)", "", (val) => {
            let m = parseFormatted(val); 
            if(isNaN(m)) return;
            
            if(m > 0) {
                bakiyeEkle('v_'+id, m); 
                db.hareketler.unshift({ id: Date.now(), tip: 'gelir', baslik: "Manuel Bakiye Ekleme", miktar: m, tarih: getTodayStr(), odemeYontemi: 'v_'+id });
            } else if(m < 0) {
                bakiyeDus('v_'+id, Math.abs(m)); 
                db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: "Manuel Bakiye Düşümü", miktar: Math.abs(m), tarih: getTodayStr(), odemeYontemi: 'v_'+id });
            }
            saveData(); 
            showToast("Bakiye güncellendi!");
        }, false);
    }

    function sellVarlik(tip) {
        let entries = db.cuzdan.filter(x => x && x.tip === tip); 
        if(entries.length === 0) return;
        
        let totalAdet = entries.reduce((sum, e) => sum + (e.miktar||0), 0); 
        let currentPrice = getAnlikFiyat(tip); 
        let isim = varlikTurleri[tip] ? varlikTurleri[tip].ad : tip;
        
        document.getElementById('dynamicFormModal').classList.remove('hidden'); 
        document.getElementById('formType').value = 'bozdur_' + tip; 
        document.getElementById('formTitle').innerText = `${isim} Bozdur`;
        
        let html = `
        <div>
            <label class="flex justify-between items-center mb-1">
                Bozdurulacak Miktar 
                <button onclick="document.getElementById('f_bozdur_adet').value='${toFormat(totalAdet, 2)}'; return false;" class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded font-bold shadow-sm hover:bg-emerald-500/30 transition-colors">

        </div>
        <div>
            <label>Bozdurma Kuru / Fiyatı (TL) <span class="text-slate-400 font-normal lowercase">- Güncel: ${toFormat(currentPrice.toFixed(2))}</span></label>
            <input type="text" id="f_bozdur_fiyat" value="${toFormat(currentPrice.toFixed(2))}" inputmode="decimal" oninput="formatNumberInput(event)">
        </div>
        `; 
        
        document.getElementById('dynamicFormBody').innerHTML = html;
    }
    
    function editHareket(id) {
        let h = db.hareketler.find(x => x && x.id === id); 
        if(!h) return;
        
        if (h.baslik && h.baslik.includes("Taksit)") && h.tip === 'gider' && h.odemeYontemi !== 'nakit' && !h.odemeYontemi.startsWith('v_')) {

        document.getElementById('dynamicFormModal').classList.remove('hidden');

        document.getElementById('formTitle').innerText = h.tip === 'gider' ? "Gideri Düzenle" : "Geliri Düzenle";
        
        let cat = h.baslik || ""; 
        let desc = ""; 
        
        if (cat.includes(" - ")) {

            desc = parts.slice(1).join(" - ");

    function undoAlacakIslem(id) {
        let a = db.alacaklar.find(x => x && x.id === id);
        if(a && a.sonIslemTutari && a.sonIslemTutari > 0) {
            let miktar = a.sonIslemTutari; 
            a.odenen -= miktar; 
            a.sonIslemTutari = 0;
            
            if(a.birim === 'TL' || !a.birim) { 
                let h_tip = a.tip === 'alacak' ? 'gider' : 'gelir'; 
                db.hareketler.unshift({ id: Date.now(), tip: h_tip, baslik: a.baslik + " (İşlem İptali)", miktar: miktar, tarih: getTodayStr(), odemeYontemi: 'nakit' }); 
            } else { 
                let c_tip = 'tl'; 
                if(a.birim === 'Çeyrek Altın') c_tip = 'ceyrek'; 
                else if(a.birim === 'Has Altın') c_tip = 'has'; 
                else if(a.birim === 'Dolar') c_tip = 'usd'; 
                else if(a.birim === 'Euro') c_tip = 'eur'; 
                else if(a.birim === 'Diğer') c_tip = a.birimDiger; 
                
                let c_kayit = db.cuzdan.find(c => c && c.tip === c_tip); 
                let islemMiktari = a.tip === 'alacak' ? -miktar : miktar; 
                
                if(c_kayit) { 
                    c_kayit.miktar = (c_kayit.miktar||0) + islemMiktari; 
                    if(c_kayit.miktar < 0) c_kayit.miktar = 0; 
                } 
            }
            saveData(); 
            showToast("Son İşlem Geri Alındı!");
        } else { 
            showToast("Geri alınacak son işlem bulunamadı!", "fa-exclamation"); 
        }
    }

        showPrompt(`${tur === 'alacak' ? 'Tahsil Edilecek' : 'Ödenecek'} Tutarı Girin:`, "", (val, odemeId) => {
            let miktar = parseFormatted(val);
            if(isNaN(miktar) || miktar <= 0) return showToast("Geçersiz tutar!", "fa-exclamation");
            islemEkle(id, tur, miktar, odemeId);
        }, true);
    }

    function promptTaksitOde(id, tur) {
        let k = db.taksitler.find(x => x && x.id === id); 
        if(!k) return;
        
        let pText = tur === 'kredi' ? `1 Taksit Tutarı (${toFormat((k.limit||0)/(k.taksitS||1))} ₺)` : `Karta Yapılacak Ödeme (Güncel Borç: ${toFormat(k.borc||0)} ₺)`;
        let dVal = tur === 'kredi' ? (k.limit||0)/(k.taksitS||1) : "";
        
        showPrompt(pText, dVal, (val, odemeId) => {
            let miktar = parseFormatted(val);
            if(isNaN(miktar) || miktar <= 0) return showToast("Geçersiz tutar!", "fa-exclamation");
            islemEkle(id, tur, miktar, odemeId);
        }, true);
    }

    function islemEkle(id, tur, miktar, odemeId) {
        if(tur === 'alacak' || tur === 'borc') {
            let kayit = db.alacaklar.find(x => x && x.id === id);
            if(kayit) { 
                kayit.odenen = (kayit.odenen||0) + miktar; 
                kayit.sonIslemTutari = miktar;
                
                if(kayit.birim === 'TL' || !kayit.birim) { 
                    let h_tip = kayit.tip === 'alacak' ? 'gelir' : 'gider'; 
                    db.hareketler.unshift({ id: Date.now(), tip: h_tip, baslik: kayit.baslik + (kayit.tip === 'alacak' ? ' Tahsilatı' : ' Borç Ödemesi'), miktar: miktar, tarih: getTodayStr(), odemeYontemi: odemeId }); 
                    
                    if(kayit.tip === 'alacak') {
                        bakiyeEkle(odemeId, miktar); 
                    } else {
                        bakiyeDus(odemeId, miktar); 
                    }
                } else { 
                    let c_tip = 'tl'; 
                    if(kayit.birim === 'Çeyrek Altın') c_tip = 'ceyrek'; 
                    else if(kayit.birim === 'Has Altın') c_tip = 'has'; 
                    else if(kayit.birim === 'Dolar') c_tip = 'usd'; 
                    else if(kayit.birim === 'Euro') c_tip = 'eur'; 
                    else if(kayit.birim === 'Diğer') c_tip = kayit.birimDiger; 
                    
                    let c_kayit = db.cuzdan.find(c => c && c.tip === c_tip); 
                    let islemMiktari = kayit.tip === 'alacak' ? miktar : -miktar; 
                    
                    if(c_kayit) { 
                        c_kayit.miktar = (c_kayit.miktar||0) + islemMiktari; 
                        if(c_kayit.miktar < 0) c_kayit.miktar = 0; 
                    } else { 
                        let anlik = getAnlikFiyat(c_tip); 
                        db.cuzdan.push({ id: Date.now(), tip: c_tip, miktar: islemMiktari, maliyet: anlik }); 
                    } 
                }
                saveData(); 
                showToast("İşlem Başarılı!"); 
            }
        } else if(tur === 'kredi') {
            let k = db.taksitler.find(x => x && x.id === id);
            if(k) { 
                k.odenen = (k.odenen||0) + miktar; 
                k.borc = (k.borc||0) - miktar; 
                bakiyeDus(odemeId, miktar); 
                db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: k.baslik + ' Kredi Taksiti', miktar: miktar, tarih: getTodayStr(), odemeYontemi: odemeId }); 
                saveData(); 
                showToast("Taksit Ödendi!"); 
            }
        } else if(tur === 'kart') {
            let k = db.taksitler.find(x => x && x.id === id);
            if(k) { 
                k.borc = (k.borc||0) - miktar; 
                if(k.borc < 0) k.borc = 0; 
                bakiyeDus(odemeId, miktar); 
                db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: k.baslik + ' Kart Borcu Ödemesi', miktar: miktar, tarih: getTodayStr(), odemeYontemi: odemeId }); 
                saveData(); 
                showToast("Borç Ödendi!"); 
            }
        }
    }

    function promptFaturaOde(id) {
        let ab = db.abonelikler.find(x => x && x.id === id); 
        if(!ab) return;
        
        showPrompt(`${ab.baslik} için ödenecek tutar:`, "", (val, odemeId) => {
            let m = parseFormatted(val);
            if(!isNaN(m) && m > 0) {
                faturaOde(id, m, odemeId);
            }
        }, true);
    }

    function faturaOde(id, miktar, odemeYontemi) {
        let ab = db.abonelikler.find(x => x && x.id === id); 
        if(ab) { 
            ab.odenen = miktar; 
            let now = new Date(); 
            ab.odemeAyi = now.getFullYear() + "-" + (now.getMonth() + 1); 
            bakiyeDus(odemeYontemi, miktar); 
            
            let fisIsmi = ab.baslik + (ab.tur === 'abonelik' ? ' Aboneliği' : ' Faturası'); 
            db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: fisIsmi, miktar: miktar, tarih: getTodayStr(), odemeYontemi: odemeYontemi }); 
            
            saveData(); 
            showToast("Ödendi!"); 
        } 
    }

    function updateHedefDots() {
        let container = document.getElementById('hedefCarousel'); 
        if(!container) return; 
        
        let scrollPos = container.scrollLeft; 
        let itemWidth = container.offsetWidth; 
        if(itemWidth === 0) return; 
        
        let activeIndex = Math.round(scrollPos / itemWidth); 
        let dots = document.querySelectorAll('#hedefDots span');
        
        dots.forEach((dot, index) => { 
            if(index === activeIndex) { 
                dot.classList.replace('bg-slate-600', 'bg-emerald-400'); 
                dot.classList.replace('w-1.5', 'w-4'); 
            } else { 
                dot.classList.replace('bg-emerald-400', 'bg-slate-600'); 
                dot.classList.replace('w-4', 'w-1.5'); 
            } 
        });
    }

                                </div>`; 
                            } else { 
                                durumIcon = `<span class="text-[9px] text-slate-400 ml-2 font-medium whitespace-nowrap bg-slate-900/50 px-1.5 py-0.5 rounded border border-white/5"><i class="fa-solid fa-calendar-day mr-1"></i>${formatTarih(a.vadeTarihi)}</span>`; 
                            }
                        }
                    }
                    
                    return `
                    <div class="glass-panel p-2 mb-2 border-l-4 border-l-${bRenk}-500" style="background-color: ${bgRenk};">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-white text-[11px] flex items-center overflow-visible">${a.baslik} ${durumIcon}</h4>
                                ${telHtml}
                            </div>
                            ${isHistory ? `
                            <div class="flex items-center gap-1 shrink-0 mt-0.5">
                                <button onclick="undoAlacakIslem(${a.id})" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 text-[9px] font-bold hover:bg-amber-500/20 transition-colors shadow-sm">
                                    <i class="fa-solid fa-rotate-left"></i> GERİ AL
                                </button>
                            </div>
                            ` : `
                            <div class="flex gap-1.5 shrink-0">
                                <button onclick="editAlacak(${a.id})" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:text-blue-400 bg-slate-900/80 rounded border border-white/5 shrink-0 transition-colors">
                                    <i class="fa-solid fa-pen text-[8px]"></i>
                                </button>
                                <button onclick="deleteItem('alacaklar', ${a.id})" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:text-rose-400 bg-slate-900/80 rounded border border-white/5 shrink-0 transition-colors">
                                    <i class="fa-solid fa-trash text-[8px]"></i>
                                </button>
                            </div>`}
                        </div>
                        
                        <div class="w-full bg-slate-900 rounded-full h-1.5 mb-2 mt-2 border border-slate-800 shadow-inner">
                            <div class="bg-${bRenk}-500 h-1.5 rounded-full shadow-[0_0_8px_currentColor]" style="width: ${yuzde}%"></div>
                        </div>
                        <div class="flex justify-between text-[8px] bg-slate-900/50 p-2 rounded border border-slate-700/50 mb-2">
                            <div class="flex flex-col">
                                <span class="text-slate-500 text-[8px] font-bold uppercase mb-0.5">Toplam</span>
                                <span class="text-slate-300 font-medium">${fmt(a.miktar)}</span>
                            </div>
                            <div class="flex flex-col text-center">
                                <span class="text-slate-500 text-[8px] font-bold uppercase mb-0.5">${isAlacak ? 'Alınan' : 'Ödenen'}</span>
                                <span class="text-${bRenk}-400 font-bold">${fmt(a.odenen)}</span>
                            </div>
                            <div class="flex flex-col text-right">
                                <span class="text-slate-500 text-[8px] font-bold uppercase mb-0.5">Kalan</span>
                                <span class="text-white font-bold">${fmt(kalan)}</span>
                                ${anlikHtml}
                            </div>
                        </div>
                        ${!isHistory ? `
                        <button onclick="promptAlacakIslem(${a.id}, '${isAlacak ? 'alacak' : 'borc'}')" class="w-full py-2 bg-gradient-to-r from-${bRenk}-500 to-${bRenk}-600 text-white rounded-lg text-[10px] font-bold shadow-md hover:brightness-110 uppercase transition-all tracking-wider">
                            ${isAlacak ? 'TAHSİL ET' : 'ÖDE'}
                        </button>
                        ` : ''}
                    </div>`;
                };
                
                let aktifHtml = aktifler.length === 0 ? `<p class="text-center text-slate-500 text-[10px] my-2">Kayıt yok.</p>` : aktifler.map(a => getHTML(a, false)).join('');
                let gecmisHtml = gecmis.length === 0 ? '' : `
                <div class="mt-2 border-t border-slate-800/50 pt-2">
                    <button onclick="document.getElementById('gecmisListesi_${isBorcSection}').classList.toggle('hidden')" class="w-full py-1.5 bg-slate-800/50 text-slate-400 hover:text-white rounded text-[9px] font-bold flex justify-between items-center px-2 border border-slate-700 transition-colors">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-clock-rotate-left"></i> Tamamlananlar / Geçmiş</span> 
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div id="gecmisListesi_${isBorcSection}" class="hidden mt-1.5 space-y-1.5 opacity-70 hover:opacity-100 transition-opacity">
                        ${gecmis.map(a => getHTML(a, true)).join('')}
                    </div>
                </div>`;
                
                return aktifHtml + gecmisHtml;
            };
            
            content.innerHTML = `
                <div class="flex items-center gap-2 mb-2 px-1">
                    <h3 class="font-bold text-white text-xs uppercase">ALACAKLARIM (Tahsil Edilecekler)</h3>
                    <button onclick="openForm('alacak', 'alacak')" class="text-emerald-400 hover:text-emerald-300">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                ${renderList(alacaklarList, 'alacak')}
                
                <div class="flex items-center gap-2 mb-2 px-1 mt-6">
                    <h3 class="font-bold text-white text-xs uppercase">VERECEKLERİM / BORÇLAR (Ödenecekler)</h3>
                    <button onclick="openForm('alacak', 'borc')" class="text-rose-400 hover:text-rose-300">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                ${renderList(borclarList, 'borc')}
            `;
        }
    }
    
    switchTab(currentTab, document.querySelector(`.nav-item[onclick*="${currentTab}"]`));
</script>
</body>
</html>
